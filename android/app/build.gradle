apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.localai"
    defaultConfig {
        applicationId "com.localai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        // 512MB heap headroom helps llama.cpp context allocation on low-RAM devices.
        // (Real model weights live in native memory, this just avoids Dalvik GC stalls.)
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // CI release signing: if MYAPP_UPLOAD_* env vars exist (GitHub Secrets),
        // sign with the real upload key; otherwise fall back to debug key so the
        // APK is still installable for personal sideloading.
        release {
            if (System.getenv("MYAPP_UPLOAD_STORE_FILE")) {
                storeFile file(System.getenv("MYAPP_UPLOAD_STORE_FILE"))
                storePassword System.getenv("MYAPP_UPLOAD_STORE_PASSWORD")
                keyAlias System.getenv("MYAPP_UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("MYAPP_UPLOAD_KEY_PASSWORD")
            } else {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            // Split per-ABI to keep each APK small; CI uploads them all.
            // Comment out `splits` if you prefer one universal APK.
            splits {
                abi {
                    reset()
                    enable true
                    universalApk true
                    include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
                }
            }
        }
    }
    // Large heap = fewer GC pauses while tokens stream.
    // (Applied via manifest android:largeHeap, kept here as documentation.)
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
