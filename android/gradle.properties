# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true

# Keep all 4 ABIs so the APK installs on any phone.
# arm64-v8a is what 99% of modern phones use (llama.rn GPU path targets it).
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# llama.rn v0.10+ REQUIRES the New Architecture.
newArchEnabled=true

# Hermes is the only JS engine (JSC removed in RN 0.81).
hermesEnabled=true

# Draw behind system bars.
edgeToEdgeEnabled=true
