name: Build Android APK (cloud)

# Your PC stays clean: every push compiles the NDK C++ (llama.cpp via
# llama.rn), Hermes + Gradle here on GitHub's servers and hands you an APK.
# No Android Studio / SDK / NDK / emulator needed locally (~35-45GB saved).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.14.3'
  ANDROID_PLATFORM: 'android-36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK: '27.1.12297006'
  # llama.rn postinstall downloads prebuilt jniLibs; keep it loud so failures are visible.
  LLAMA_RN_VERBOSE: '1'

jobs:
  build-apk:
    name: Assemble app-release.apk
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up JDK 17 (React Native 0.81 requirement)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform, build-tools, NDK & CMake
        run: |
          set -eux
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK}" >> "$GITHUB_ENV"
          "$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK}/ndk-build" --version || true

      - name: Install JS deps (triggers llama.rn prebuilt C++ download)
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Verify llama.rn native libs landed
        run: |
          set -eux
          ls node_modules/llama.rn/android/src/main/jniLibs 2>/dev/null || echo "WARN: jniLibs not in package (postinstall may fetch on build)"
          node -e "console.log('llama.rn', require('llama.rn/package.json').version)"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run unit tests (agent memory / orchestrator)
        run: npx jest --ci --passWithNoTests

      - name: Download Gradle ${{ env.GRADLE_VERSION }}
        run: |
          set -eux
          cd /tmp
          curl -sSL -o gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q -o gradle.zip
          /tmp/gradle-${GRADLE_VERSION}/bin/gradle --version

      - name: Ensure debug keystore exists
        working-directory: android/app
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore for APK signing..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Assemble Release APK
        working-directory: android
        run: |
          set -eux
          # local.properties pins the SDK for the Gradle run
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK}" >> local.properties
          /tmp/gradle-${GRADLE_VERSION}/bin/gradle :app:assembleRelease \
            --no-daemon \
            --parallel \
            --max-workers=2 \
            -PreactNativeArchitectures="armeabi-v7a,arm64-v8a,x86,x86_64"

      - name: List APKs + sizes
        run: |
          set -eux
          find android/app/build/outputs/apk -name '*.apk' -exec ls -lh {} \;

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verdant-release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
